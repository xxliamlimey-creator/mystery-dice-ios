name: Build IPA

# Produces an unsigned .ipa on a free GitHub macOS runner.
# You sign it on install with Sideloadly / AltStore / Xcode — see docs/SIGNING.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MysteryDice.xcodeproj \
            -scheme MysteryDice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MysteryDice.app"
          test -d "$APP" || { echo "::error::Build produced no .app"; exit 1; }

          rm -rf artifacts && mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          # An .ipa is just a zip whose root contains Payload/<App>.app
          (cd artifacts && zip -qry MysteryDice-unsigned.ipa Payload)

          test -f artifacts/MysteryDice-unsigned.ipa
          ls -lh artifacts/MysteryDice-unsigned.ipa
          shasum -a 256 artifacts/MysteryDice-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MysteryDice-unsigned-ipa
          path: artifacts/MysteryDice-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Want a signed .ipa straight out of CI? Add these repository secrets and
      # swap the job above for an archive + exportArchive run:
      #
      #   BUILD_CERTIFICATE_BASE64   base64 of your .p12
      #   P12_PASSWORD
      #   BUILD_PROVISION_PROFILE_BASE64
      #   KEYCHAIN_PASSWORD
      #   DEVELOPMENT_TEAM
      #
      # Then: xcodebuild archive -> xcodebuild -exportArchive -exportOptionsPlist
      # See docs/SIGNING.md, section "Signing inside CI".
      # ---------------------------------------------------------------------
